---
layout: default
---

<section class="page-hero" aria-labelledby="page-title">
  <div class="wrap">
    <p class="eyebrow">{{ page.eyebrow }}</p>
    <h1 id="page-title">{{ page.title }}.</h1>
  </div>
</section>
<article class="wrap page-copy{% if page.wide %} page-copy-wide{% endif %}{% if page.full_width %} page-copy-full{% endif %}">
  {{ content }}
</article>
